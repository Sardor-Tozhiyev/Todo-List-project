{% extends "base.html" %}

{% block title %}
  Tags
{% endblock %}

{% block content %}

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Tags</h1>

    <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary">
      Add tag
    </a>
  </div>

  {% if tags %}

    <table class="table">

      <thead>
        <tr>
          <th>Name</th>
          <th class="text-center">Update</th>
          <th class="text-center">Delete</th>
        </tr>
      </thead>

      <tbody>

        {% for tag in tags %}
          <tr>

            <td>{{ tag.name }}</td>

            <td class="text-center">
              <a
                href="{% url 'tasks:tag-update' tag.pk %}"
                class="btn btn-secondary btn-sm"
              >
                Update
              </a>
            </td>

            <td class="text-center">
              <a
                href="{% url 'tasks:tag-delete' tag.pk %}"
                class="btn btn-danger btn-sm"
              >
                Delete
              </a>
            </td>

          </tr>
        {% endfor %}

      </tbody>

    </table>

  {% else %}

    <p>No tags yet.</p>

  {% endif %}

{% endblock %}
