{% extends "base.html" %}

{% block title %}Tags{% endblock %}

{% block content %}

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title">Tags</h1>

    <a
      href="{% url 'tasks:tag-create' %}"
      class="btn btn-primary btn-lg"
    >
      Add tag
    </a>
  </div>

  <table class="table">

    <thead>
      <tr>
        <th>Name</th>
        <th class="text-end">Actions</th>
      </tr>
    </thead>

    <tbody>

      {% for tag in tags %}
        <tr>

          <td>
            {{ tag.name }}
          </td>

          <td class="text-end">

            <a href="{% url 'tasks:tag-update' tag.pk %}">
              Update
            </a>

            |

            <a href="{% url 'tasks:tag-delete' tag.pk %}">
              Delete
            </a>

          </td>

        </tr>

      {% empty %}

        <tr>
          <td colspan="2" class="text-center text-muted">
            No tags found.
          </td>
        </tr>

      {% endfor %}

    </tbody>

  </table>

{% endblock %}
