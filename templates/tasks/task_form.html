{% extends "base.html" %}

{% block title %}
  {{ title }}
{% endblock %}

{% block content %}

  <h1 class="page-title">
    {{ title }}
  </h1>

  <div class="form-wrapper">

    <form method="post">

      {% csrf_token %}

      {{ form.as_p }}

      <div class="mt-4">

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save
        </button>

        <a
          href="{% url 'tasks:home' %}"
          class="btn btn-secondary"
        >
          Cancel
        </a>

      </div>

    </form>

  </div>

{% endblock %}
