{% extends "base.html" %}

{% block title %}
  Delete task
{% endblock %}

{% block content %}

  <div class="delete-box">

    <h1 class="page-title">
      Delete task
    </h1>

    <p class="fs-4 mb-4">
      Are you sure you want to delete this task?
    </p>

    <div class="alert alert-light border">
      <strong>{{ task.content }}</strong>
    </div>

    <form method="post">

      {% csrf_token %}

      <button
        type="submit"
        class="btn btn-danger"
      >
        Delete
      </button>

      <a
        href="{% url 'tasks:home' %}"
        class="btn btn-secondary"
      >
        Cancel
      </a>

    </form>

  </div>

{% endblock %}
